<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu | Riza Tea</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .menu-hero {
      padding: 120px 1.5rem 3rem;
      text-align: center;
      background: radial-gradient(ellipse at center top, rgba(200,134,10,.1), transparent 55%);
    }
    .menu-search-wrap {
      max-width: 500px; margin: 2rem auto 0;
      position: relative;
    }
    .menu-search {
      width: 100%; padding: .9rem 1.2rem .9rem 3rem;
      background: var(--card); border: 1px solid rgba(200,134,10,.25);
      border-radius: 50px; color: var(--cream); font-size: .95rem;
      outline: none; transition: border-color .3s;
    }
    .menu-search:focus { border-color: var(--gold); }
    .menu-search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .menu-search::placeholder { color: var(--muted); }

    .menu-cats {
      display: flex; gap: .6rem; flex-wrap: wrap;
      justify-content: center; margin: 2rem 0;
      padding: 0 1rem;
    }
    .menu-cat-btn {
      padding: .5rem 1.2rem; border-radius: 30px;
      border: 1px solid rgba(200,134,10,.25);
      color: var(--muted); font-size: .85rem;
      cursor: pointer; transition: all .25s;
      display: flex; align-items: center; gap: .4rem;
    }
    .menu-cat-btn:hover, .menu-cat-btn.active {
      border-color: var(--gold); color: var(--gold);
      background: rgba(200,134,10,.08);
    }

    .menu-body {
      max-width: 1100px; margin: 0 auto;
      padding: 0 clamp(1rem,4vw,2.5rem) 5rem;
    }

    .menu-section { margin-bottom: 3.5rem; }
    .menu-section-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem; padding-bottom: .8rem;
      border-bottom: 1px solid rgba(200,134,10,.15);
    }
    .menu-section-icon { font-size: 1.8rem; }
    .menu-section-title {
      font-family: 'Playfair Display', 'Noto Serif Arabic', serif;
      font-size: 1.5rem; color: var(--cream);
    }
    .menu-section-title-ar { font-size: .9rem; color: var(--muted); }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .menu-item {
      background: var(--card);
      border: 1px solid rgba(200,134,10,.1);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; transition: all .25s;
    }
    .menu-item:hover {
      border-color: rgba(200,134,10,.35);
      transform: translateY(-2px);
    }
    .menu-item.hidden { display: none; }
    .menu-item-info { flex: 1; }
    .menu-item-name { font-size: 1rem; font-weight: 500; color: var(--cream); margin-bottom: .15rem; }
    .menu-item-name-ar { font-size: .85rem; color: var(--muted); }
    .menu-item-desc { font-size: .8rem; color: var(--muted); margin-top: .4rem; line-height: 1.5; }
    .menu-item-price {
      color: var(--gold); font-weight: 600; font-size: 1rem;
      white-space: nowrap; flex-shrink: 0;
    }
    .menu-item-unavail { opacity: .4; }
    .menu-item-badge {
      font-size: .7rem; padding: .15rem .5rem; border-radius: 10px;
      background: rgba(200,134,10,.15); color: var(--gold);
      margin-left: .4rem; vertical-align: middle;
    }

    .no-results {
      text-align: center; padding: 4rem; color: var(--muted);
    }
    .no-results span { font-size: 3rem; display: block; margin-bottom: 1rem; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">
    <svg viewBox="0 0 42 42" fill="none"><circle cx="21" cy="21" r="20" stroke="#C8860A" stroke-width="1.5"/><text x="21" y="26" font-family="serif" font-size="16" fill="#C8860A" text-anchor="middle">ر</text></svg>
    <div class="nav-logo-text">
      <div class="en">RIZA TEA</div>
      <div class="ar">شاي ريزا</div>
    </div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" data-i18n="nav_home">Home</a></li>
    <li><a href="menu.html" class="active" data-i18n="nav_menu">Menu</a></li>
    <li><a href="loyalty.html" data-i18n="nav_loyalty">Loyalty Card</a></li>
    <li><a href="index.html#contact" data-i18n="nav_contact">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <button class="btn-lang" id="langToggle">عربي</button>
    <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="menu-hero">
  <div class="section-label" style="justify-content:center" data-i18n="menu_label">What We Serve</div>
  <h1 class="section-title" data-i18n="menu_title">Our <span>Menu</span></h1>
  <p style="color:var(--muted);margin-top:.5rem" data-i18n="menu_sub">Prices in AED. All items freshly prepared.</p>
  <div class="menu-search-wrap">
    <span class="menu-search-icon">🔍</span>
    <input type="search" class="menu-search" id="menuSearch" placeholder="Search menu..." data-i18n-placeholder="menu_search_placeholder"/>
  </div>
</div>

<div class="menu-cats" id="menuCats">
  <button class="menu-cat-btn active" data-cat="all">☕ <span data-i18n="cat_all">All</span></button>
</div>

<div class="menu-body" id="menuBody">
  <div style="text-align:center;padding:4rem;color:var(--muted)">Loading menu…</div>
</div>

<footer class="footer">
  <div class="footer-logo">Riza Tea</div>
  <div class="footer-links">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="menu.html" data-i18n="nav_menu">Menu</a>
    <a href="loyalty.html" data-i18n="nav_loyalty">Loyalty Card</a>
  </div>
  <div class="footer-copy">© 2025 Riza Tea</div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
